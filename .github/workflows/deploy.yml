name: Deploy Next.js with rsync (single host)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files via rsync (SSH uses SERVER_HOST)
        shell: bash
        run: |
          rsync -avzr --delete \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='node_modules' \
            --exclude='.next' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: SSH Remote Commands for PM2 (SSH uses SERVER_HOST)
        shell: bash
        run: |
          ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && npm install --legacy-peer-deps && npm run build && pm2 reload tnjensen-app || pm2 start npm --name tnjensen-app -- start && pm2 save"
